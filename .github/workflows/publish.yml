name: Publish to npm

# Publishes with npm trusted publishing (OIDC): no npm token is stored in this repo, and npm adds a
# provenance attestation that ties each release to this workflow run and its commit. The build job
# installs, verifies, and packs without any publish rights. The publish job, which alone can request
# an OIDC token, runs in the npm-publish environment, which only v*.*.* tags can deploy to, and
# publishes exactly the tarball the build job verified.
on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check the tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          if ! awk -v v="$version" '$1 == "##" && $2 == v { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "$GITHUB_REF_NAME points to a commit that isn't on master" >&2
            exit 1
          fi

      - name: Install
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Verify
        run: make verify

      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP/pack" --json | node -p 'JSON.parse(require("fs").readFileSync(0))[0].filename')"
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "tarball=$tarball"
            echo "sha256=$(sha256sum "$RUNNER_TEMP/pack/$tarball" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          # Long enough to rerun a failed publish job later.
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      # Trusted publishing needs npm 11.5.1 or newer, which current Node 24 releases bundle.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: pack

      - name: Verify the tarball is the one the build job tested
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  pack/$TARBALL" | sha256sum --check

      # A prerelease such as 5.1.0-beta.1 goes to its prerelease tag (`beta`), as the old release
      # script did. A stable version must be newer than the current `latest`, so `latest` never
      # moves backward.
      - name: Choose the dist-tag
        id: dist_tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            prerelease="${VERSION#*-}"
            echo "tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(npm view react-plaid-link dist-tags.latest --registry=https://registry.npmjs.org/)"
          newer="$(node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            const diff = a.map((n, i) => n - b[i]).find((d) => d !== 0) ?? 0;
            console.log(diff > 0);
          ' "$VERSION" "$current")"
          if [[ "$newer" != "true" ]]; then
            echo "$VERSION isn't newer than the current latest, $current" >&2
            exit 1
          fi
          echo "tag=latest" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          DIST_TAG: ${{ steps.dist_tag.outputs.tag }}
        run: npm publish "./pack/$TARBALL" --tag "$DIST_TAG" --ignore-scripts
